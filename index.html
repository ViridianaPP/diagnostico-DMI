<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Productos</title>
    <link rel='stylesheet' href='css/bootstrap.min.css'>
    <link rel='stylesheet' href='css/styles.css'>
</head>

<body>
    <main class="container py-4">
        <div class="product-list-shell mx-auto">
            <div class="d-flex d-md-none align-items-center justify-content-between mb-3">
                <span class="fw-semibold">Brand</span>
                <button class="btn btn-sm p-0 border-0" type="button" aria-label="Carrito de compras">
                    <img src="icons/shopping-cart.svg" alt="Carrito" width="18" height="18">
                </button>
            </div>

            <nav class="navbar navbar-expand d-none d-md-flex bg-white border rounded px-3 py-2 mb-4">
                <a class="navbar-brand fw-semibold mb-0" href="#">Brand</a>
                <ul class="navbar-nav flex-row ms-3 gap-3 small">
                    <li class="nav-item"><a class="nav-link px-0" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link px-0 active fw-semibold" href="#">Productos</a></li>
                    <li class="nav-item"><a class="nav-link px-0" href="#">Nosotros</a></li>
                </ul>
                <button class="btn btn-sm ms-auto p-0 border-0" type="button" aria-label="Carrito de compras">
                    <img src="icons/shopping-cart.svg" alt="Carrito" width="18" height="18">
                </button>
            </nav>

            <div class="mb-3">
                <h1 class="h4 mb-0">Nuestros productos</h1>
            </div>

            <div class="row g-2 mb-3 align-items-center">
                <div class="col">
                    <input type="text" class="form-control form-control-sm" placeholder="Buscar producto..." aria-label="Buscar producto">
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-sm btn-light border">Filtrar</button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 g-3 mb-4">
                <div class="col">
                    <article class="card h-100">
                        <div class="card-body p-3">
                            <div class="product-card-layout">
                                <div class="product-card-image-wrap">
                                    <img src="img/producto1" alt="Aud&iacute;fonos inal&aacute;mbricos" class="border rounded product-image" width="220" height="140">
                                </div>
                                <div class="product-card-info">
                                    <h2 class="h6 mb-1 product-title">Aud&iacute;fonos inal&aacute;mbricos</h2>
                                    <p class="text-warning small mb-1">$59.99</p>
                                    <p class="small text-warning mb-0">★★★★★</p>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <div class="col">
                    <article class="card h-100">
                        <div class="card-body p-3">
                            <div class="product-card-layout">
                                <div class="product-card-image-wrap">
                                    <img src="img/producto2" alt="Smartwatch Pro" class="border rounded product-image" width="220" height="140">
                                </div>
                                <div class="product-card-info">
                                    <h2 class="h6 mb-1 product-title">Smartwatch Pro</h2>
                                    <p class="text-warning small mb-1">$89.99</p>
                                    <p class="small text-warning mb-0">★★★★★</p>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <div class="col">
                    <article class="card h-100">
                        <div class="card-body p-3">
                            <div class="product-card-layout">
                                <div class="product-card-image-wrap">
                                    <img src="img/producto3" alt="C&aacute;mara digital" class="border rounded product-image" width="220" height="140">
                                </div>
                                <div class="product-card-info">
                                    <h2 class="h6 mb-1 product-title">C&aacute;mara digital</h2>
                                    <p class="text-warning small mb-1">$199.99</p>
                                    <p class="small text-warning mb-0">★★★★★</p>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>

                <div class="col">
                    <article class="card h-100">
                        <div class="card-body p-3">
                            <div class="product-card-layout">
                                <div class="product-card-image-wrap">
                                    <img src="img/producto4" alt="Mochila urbana" class="border rounded product-image" width="220" height="140">
                                </div>
                                <div class="product-card-info">
                                    <h2 class="h6 mb-1 product-title">Mochila urbana</h2>
                                    <p class="text-warning small mb-1">$39.99</p>
                                    <p class="small text-warning mb-0">★★★★★</p>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <nav aria-label="Paginaci&oacute;n de productos">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                </ul>
            </nav>
        </div>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
